[dev-dependencies]
tempfile.workspace = true
# Font backend (also used transitively by epaint) — lets the font-coverage
# test inspect the bundled TTFs' cmaps. See theme::install_fonts.
ab_glyph = "0.2"

# winit (pulled in transitively by eframe) ships its Linux backends behind
# the x11 / wayland features. eframe 0.29 doesn't propagate them, so Linux
# builds fail at compile time with `The platform you're compiling for is
# not supported by winit`. Enabling them here forces cargo's feature merge
# to turn them on in the transitive winit dep — Windows/macOS are unaffected.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", features = ["x11", "wayland"] }
