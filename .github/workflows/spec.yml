name: spec

# Dogfood: build the oxidant binary, then use its own spec subcommands to
# check the spec tree for warnings (validate) and spec↔code drift (diff).
# Both gates run with --strict so any finding fails the workflow and turns
# the badge red. See README.md and spec/decisions/0008-spec-is-canonical.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build oxidant
        run: cargo build -p oxidant --release

      - name: oxidant spec validate --strict
        run: ./target/release/oxidant spec validate --strict

      - name: oxidant spec diff --strict
        run: ./target/release/oxidant spec diff --strict
